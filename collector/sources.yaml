# Hormuz OSINT Monitor - source feeds
# Order mirrors the site language priority: Persian, then Arabic, then English.
#
# Two feed kinds are supported:
#   - kind: gnews   -> a Google News RSS *search* built from `query` + locale.
#                      This is the reliable multilingual backbone: it pulls
#                      Hormuz-matching items from hundreds of publishers per
#                      language, and each item keeps its ORIGINAL publisher,
#                      which is what the confidence tag is scored on.
#   - kind: rss     -> a direct RSS/Atom URL from a single publisher.
#
# `category` is informational only (news | social | maritime | official).
# Add X/Twitter, Telegram or Mastodon feeds here later (kind: rss) once you
# have a working bridge/instance or API key. Nothing here is fact-checked.

# ---------------------------------------------------------------- Persian (fa)
- name: "Google News (فارسی)"
  kind: gnews
  lang: fa
  query: "تنگه هرمز"
  hl: fa
  gl: IR
  ceid: "IR:fa"
  category: news

- name: "BBC News فارسی"
  kind: rss
  lang: fa
  url: "https://feeds.bbci.co.uk/persian/rss.xml"
  category: news

- name: "DW فارسی"
  kind: rss
  lang: fa
  url: "https://rss.dw.com/rdf/rss-per-all"
  category: news

- name: "Radio Farda"
  kind: rss
  lang: fa
  url: "https://www.radiofarda.com/api/zrqiteuuir"
  category: news

