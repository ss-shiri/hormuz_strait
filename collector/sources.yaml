# Hormuz OSINT Monitor - source feeds
# ---------------------------------------------------------------------------
# Source collection only. Nothing is fact-checked here.
#
# Feed kinds:
#   gnews -> Google News RSS search
#   rss   -> direct RSS/Atom feed
#
# Google News preserves the original publisher in the feed item; the
# collector uses that publisher for source-reliability classification.
#
# `category` is informational only:
#   news | social | maritime | official
#
# Language priority:
#   Persian -> Arabic -> English
#
# IMPORTANT:
# Google News locale parameters are used only to bias regional/language
# discovery. They do not restrict results exclusively to that country.

# ---------------------------------------------------------------------------
# Persian (fa)
# ---------------------------------------------------------------------------

- name: "Google News (فارسی)"
  kind: gnews
  lang: fa
  query: "تنگه هرمز"
  hl: "fa"
  gl: "IR"
  ceid: "IR:fa"
  category: news

- name: "BBC News فارسی"
  kind: rss
  lang: fa
  url: "https://feeds.bbci.co.uk/persian/rss.xml"
  category: news

- name: "DW فارسی"
  kind: rss
  lang: fa
  url: "https://rss.dw.com/rdf/rss-per-all"
  category: news

- name: "Radio Farda"
  kind: rss
  lang: fa
  url: "https://www.radiofarda.com/api/zrqiteuuir"
  category: news


