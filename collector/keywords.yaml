# Hormuz OSINT Monitor - multilingual keyword filter
#
# An item is retained when its title or summary contains at least
# one core term. Context terms are optional and are recorded when present.
#
# Matching is case-insensitive in the collector.

core:
  # Persian
  - "هرمز"
  - "تنگه هرمز"
  - "تنگه‌ی هرمز"
  - "تنگهٔ هرمز"

  # Arabic
  - "مضيق هرمز"
  - "مضيق هرمز الدولي"
  - "مضيق هرمز البحري"

  # English
  - "Hormuz"
  - "Strait of Hormuz"
  - "Hormuz Strait"

