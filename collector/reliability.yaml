# Source-reliability model
# ---------------------------------------------------------------------------
# IMPORTANT:
# `confidence` describes SOURCE RELIABILITY ONLY, not the truth of an individual
# claim. This is an OSINT COLLECTION feed; collected items are NOT fact-checked.
#
# Scale:
#   A = high confidence source
#   B = high-quality specialist / institutional source
#   C = established mainstream / specialist media
#   D = state-owned / state-aligned media
#   E = aggregators / user-generated / platform sources
#   F = unknown or unrated source
#
# Matching:
# Each rule is tested case-insensitively against both publisher DOMAIN and NAME.
# The FIRST matching rule wins.
#
# IMPORTANT:
# More specific domains are intentionally included before generic outlet names
# where possible to reduce false-positive source classification.

default:
  tier: low
  letter: F

rules:

  # -------------------------------------------------------------------------
  # HIGH (A)
  # Primary institutions, official authorities and major wire services
  # -------------------------------------------------------------------------
  - tier: high
    letter: A
    match:
      - "reuters.com"
      - reuters
      - "apnews.com"
      - apnews
      - "ap.org"
      - afp
      - "afp.com"
      - bloomberg
      - "bloomberg.com"
      - "iaea.org"
      - "eia.gov"
      - "iea.org"
      - "opcw.org"
      - "un.org"
      - "nato.int"
      - "congress.gov"
      - "crsreports.congress.gov"
      - crs
      - "state.gov"
      - "defense.gov"
      - "centcom.mil"
      - centcom
      - "ukmto.org"
      - ukmto
      - "gov.uk"
      - "imo.org"

  # -------------------------------------------------------------------------
  # HIGH (B)
  # Specialist institutions, established analytical organizations and
  # specialist intelligence / maritime / energy research sources
  # -------------------------------------------------------------------------
  - tier: high
    letter: B
    match:
      - "ft.com"
      - "wsj.com"
      - "economist.com"
      - economist
      - "crisisgroup.org"
      - "isis-online.org"
      - "isis-online"
      - "iiss.org"
      - "csis.org"
      - "rand.org"
      - "chathamhouse.org"
      - chathamhouse
      - "brookings.edu"
      - "lloydslist.com"
      - lloydslist
      - "lloyds.com"
      - lloyds
      - ambrey
      - "ambrey.com"
      - tankertrackers
      - "tankertrackers.com"
      - kpler
      - "kpler.com"
      - "janes.com"
      - janes
      - "washingtonpost.com"
      - washingtonpost
      - "nytimes.com"
      - nytimes

  # -------------------------------------------------------------------------
  # MEDIUM (C)
  # Established mainstream media and specialist trade press
  # -------------------------------------------------------------------------
  - tier: medium
    letter: C
    match:
      - "aljazeera.com"
      - aljazeera
      - "bbc.co.uk"
      - "bbc.com"
      - "cnn.com"
      - cnn
      - "cnbc.com"
      - cnbc
      - "theguardian.com"
      - guardian
      - "npr.org"
      - npr
      - "axios.com"
      - axios
      - "politico.com"
      - politico
      - "france24.com"
      - france24
      - "dw.com"
      - "dw.de"
      - "thenationalnews.com"
      - thenationalnews
      - "arabnews.com"
      - arabnews
      - "alarabiya.net"
      - alarabiya
      - "alhurra.com"
      - alhurra
      - "timesofisrael.com"
      - timesofisrael
      - "jpost.com"
      - jpost
      - "haaretz.com"
      - haaretz
      - "middleeasteye.net"
      - middleeasteye
      - "al-monitor.com"
      - "al-monitor"
      - "gcaptain.com"
      - gcaptain
      - "maritime-executive.com"
      - "maritime-executive"
      - "splash247.com"
      - splash247
      - "tradewindsnews.com"
