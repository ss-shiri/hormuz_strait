  # -------------------------------------------------------------------------
  # MEDIUM (D)
  # State-owned / state-aligned outlets.
  #
  # Classification reflects editorial independence, NOT factual accuracy of
  # every individual report.
  # -------------------------------------------------------------------------
  - tier: medium
    letter: D
    match:
      - "irna.ir"
      - irna
      - "mehrnews.com"
      - mehrnews
      - "mehr"
      - "tasnimnews.com"
      - tasnim
      - "presstv.ir"
      - "press tv"
      - presstv
      - "farsnews.ir"
      - farsnews
      - "fars "
      - "tabnak.ir"
      - tabnak
      - "isna.ir"
      - isna
      - "iribnews.ir"
      - iribnews
      - "sana.sy"
      - sana
      - "rt.com"
      - "russia today"
      - "sputniknews.com"
      - sputnik
      - "ria.ru"
      - "ria novosti"
      - "xinhua.net"
      - xinhua
      - "cgtn.com"
      - cgtn
      - "wam.ae"
