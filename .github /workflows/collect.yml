name: collect-hormuz-osint

# Near-real-time collection. GitHub's scheduler runs at ~15-minute granularity
# and may be delayed under load, so this is "as live as GitHub Actions allows".
# For true streaming you would run collector/collect.py on your own host/cron.
on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 minutes (UTC)
  workflow_dispatch: {}         # manual "Run workflow" button
  push:
    branches: [ main ]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

# Only one collection run at a time; let a newer run cancel a stuck older one.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write               # needed to commit the refreshed feed.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collector/collect.py

      - name: Commit updated feed
        run: |
          git config user.name  "hormuz-osint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/feed.json
          if git diff --cached --quiet; then
            echo "No new items - nothing to commit."
          else
            git commit -m "feed: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
