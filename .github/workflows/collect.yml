```yaml
name: collect-hormuz-osint

# Near-real-time collection.
# GitHub Actions schedule is approximately 15-minute granularity
# and may be delayed under load.
#
# For true continuous/streaming collection, run:
# collector/collect.py
# on a dedicated host, VPS, container, or local scheduler.

on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 minutes (UTC)

  workflow_dispatch: {}         # manual execution

  push:
    branches:
      - main
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

# Prevent overlapping collection jobs.
# A newer scheduled/manual run cancels an older run if necessary.
concurrency:
  group: collect
  cancel-in-progress: true

permissions:
  contents: write               # required to commit refreshed feed.json

jobs:
  collect:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      # ------------------------------------------------------------
      # 4. Run OSINT collector
      # ------------------------------------------------------------
      - name: Run collector
        run: |
          python collector/collect.py

      # ------------------------------------------------------------
      # 5. Check generated data
      # ------------------------------------------------------------
      - name: Check feed
        run: |
          if [ ! -f "docs/data/feed.json" ]; then
            echo "ERROR: docs/data/feed.json was not generated."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/feed.json")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"ERROR: Invalid JSON: {exc}")
              raise SystemExit(1)

          print(f"Valid JSON: {path}")

          if isinstance(data, list):
              print(f"Items: {len(data)}")
          elif isinstance(data, dict):
              print(f"Top-level keys: {list(data.keys())[:10]}")
          else:
              print(f"WARNING: Unexpected top-level type: {type(data).__name__}")
          PY

      # ------------------------------------------------------------
      # 6. Commit refreshed feed
      # ------------------------------------------------------------
      - name: Commit updated feed
        run: |
          git config user.name "hormuz-osint-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/data/feed.json

          if git diff --cached --quiet; then
            echo "No new items - nothing to commit."
            exit 0
          fi

          git commit -m "feed: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Synchronize with remote before pushing.
          git pull --rebase origin main

          git push origin HEAD:main
```
