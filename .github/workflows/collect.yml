```yaml
name: Hormuz OSINT — Collect Feed

# ============================================================================
# Hormuz OSINT Monitor
#
# Purpose:
#   Scheduled RSS/Atom collection and publication of docs/data/feed.json
#
# IMPORTANT:
#   This workflow performs COLLECTION only.
#   It does not verify intelligence claims.
#
# Schedule:
#   Every 15 minutes UTC
#
# Manual:
#   workflow_dispatch
#
# Automatic push execution:
#   Only when collector/workflow/dependency configuration changes.
# ============================================================================

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

# Prevent overlapping collectors from writing/pushing simultaneously.
concurrency:
  group: hormuz-osint-collector
  cancel-in-progress: false

# Required to commit feed.json back to the repository.
permissions:
  contents: write

jobs:

  # ==========================================================================
  # COLLECT
  # ==========================================================================

  collect:
    name: Collect OSINT feeds
    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:

      # ----------------------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      # ----------------------------------------------------------------------
      # PYTHON
      # ----------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      # ----------------------------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r collector/requirements.txt

      # ----------------------------------------------------------------------
      # COLLECT
      # ----------------------------------------------------------------------

      - name: Run OSINT collector
        run: |
          python collector/collect.py

      # ----------------------------------------------------------------------
      # VALIDATE OUTPUT
      # ----------------------------------------------------------------------

      - name: Validate feed.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/feed.json")

          if not path.exists():
              raise SystemExit("ERROR: feed.json was not created.")

          if path.stat().st_size == 0:
              raise SystemExit("ERROR: feed.json is empty.")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("ERROR: feed.json root must be an object.")

          if not isinstance(data.get("meta"), dict):
              raise SystemExit("ERROR: feed.json meta must be an object.")

          if not isinstance(data.get("items"), list):
              raise SystemExit("ERROR: feed.json items must be a list.")

          required_item_fields = {
              "id",
              "title",
              "link",
              "source",
              "published",
              "published_ts",
          }

          for index, item in enumerate(data["items"]):
              if not isinstance(item, dict):
                  raise SystemExit(
                      f"ERROR: item {index} is not an object."
                  )

              missing = required_item_fields - item.keys()

              if missing:
                  raise SystemExit(
                      f"ERROR: item {index} missing fields: "
                      f"{sorted(missing)}"
                  )

          print(
              f"Feed validation OK: "
              f"{len(data['items'])} items"
          )
          PY

      # ----------------------------------------------------------------------
      # SHOW COLLECTION SUMMARY
      # ----------------------------------------------------------------------

      - name: Collection summary
        run: |
          python - <<'PY'
          import json

          with open(
              "docs/data/feed.json",
              "r",
              encoding="utf-8"
          ) as f:
              feed = json.load(f)

          meta = feed.get("meta", {})

          print("========================================")
          print("Hormuz OSINT Collection Summary")
          print("========================================")
          print(f"Total items      : {meta.get('count', 0)}")
          print(f"New this run     : {meta.get('new_this_run', 0)}")
          print(f"Sources OK       : {len(meta.get('sources_ok', []))}")
          print(f"Sources failed   : {len(meta.get('sources_failed', []))}")
          print(f"Generated        : {meta.get('generated_at', 'unknown')}")
          print("========================================")
          PY

      # ----------------------------------------------------------------------
      # COMMIT / PUSH
      # ----------------------------------------------------------------------

      - name: Commit updated feed
        run: |
          git config user.name "hormuz-osint-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/data/feed.json

          if git diff --cached --quiet; then
            echo "No feed changes detected."
            exit 0
          fi

          git commit \
            -m "feed: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"

          git push
```
