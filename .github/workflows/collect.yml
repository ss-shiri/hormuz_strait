name: collect-hormuz-osint

on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 minutes (UTC)
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"

concurrency:
  group: collect
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run collector
        run: python collector/collect.py

      - name: Commit updated feed
        run: |
          git config user.name  "hormuz-osint-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/data/feed.json

          if git diff --cached --quiet; then
            echo "No new items - nothing to commit."
          else
            git commit -m "feed: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
