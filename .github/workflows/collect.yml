name: Collect Hormuz Feed

on:
  schedule:
    - cron: "0 * * * *"   # هر ساعت
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run collector
        run: python collector/collect.py

      - name: Commit feed.json
        run: |
          if [ -f docs/data/feed.json ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add docs/data/feed.json
            git commit -m "Update feed.json" || echo "No changes"
            git push
          else
            echo "feed.json not found — collector failed"
          fi
