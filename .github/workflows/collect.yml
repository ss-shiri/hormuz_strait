name: collect-hormuz-osint

# Hormuz OSINT Monitor
# Collector workflow — runs every ~15 minutes and can also be triggered manually.
# The collector commits feed.json itself, so no push trigger is needed.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Prevent concurrent collectors from modifying feed.json simultaneously.
concurrency:
  group: hormuz-osint-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: Collect Hormuz OSINT
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r collector/requirements.txt

      - name: Run collector
        run: |
          python collector/collect.py

      - name: Validate feed.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/feed.json")

          if not path.exists():
              raise SystemExit("ERROR: docs/data/feed.json does not exist")

          if path.stat().st_size == 0:
              raise SystemExit("ERROR: feed.json is empty")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("ERROR: feed.json root must be an object")

          if not isinstance(data.get("meta"), dict):
              raise SystemExit("ERROR: meta must be an object")

          if not isinstance(data.get("items"), list):
              raise SystemExit("ERROR: items must be a list")

          required = {
              "id",
              "title",
              "link",
              "source",
              "published",
              "published_ts",
          }

          for i, item in enumerate(data["items"]):
              if not isinstance(item, dict):
                  raise SystemExit(f"ERROR: item {i} is not an object")

              missing = required - item.keys()
              if missing:
                  raise SystemExit(f"ERROR: item {i} missing: {sorted(missing)}")

          print(f"VALID: {len(data['items'])} feed items")
          PY

      - name: Show collection summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("docs/data/feed.json", "r", encoding="utf-8") as f:
              feed = json.load(f)

          meta = feed.get("meta", {})

          summary = (
              "\n==============================================\n"
              "        HORMUZ OSINT COLLECTION\n"
              "==============================================\n"
              f"Total items    : {meta.get('count', 0)}\n"
              f"New this run   : {meta.get('new_this_run', 0)}\n"
              f"Sources OK     : {len(meta.get('sources_ok', []))}\n"
              f"Sources failed : {len(meta.get('sources_failed', []))}\n"
              f"Generated      : {meta.get('generated_at', 'unknown')}\n"
              "==============================================\n"
          )
          print(summary)

          # Render visually in GitHub Actions Run Summary UI
          summary_file = os.getenv("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as sf:
                  sf.write("### Hormuz OSINT Collection Summary\n")
                  sf.write(f"- **Total items**: {meta.get('count', 0)}\n")
                  sf.write(f"- **New this run**: {meta.get('new_this_run', 0)}\n")
                  sf.write(f"- **Sources OK**: {len(meta.get('sources_ok', []))}\n")
                  sf.write(f"- **Sources failed**: {len(meta.get('sources_failed', []))}\n")
                  sf.write(f"- **Generated**: {meta.get('generated_at', 'unknown')}\n")
          PY

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/feed.json

          if git diff --cached --quiet; then
            echo "No feed changes detected."
            exit 0
          fi

          git commit -m "feed: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }}
          git push
