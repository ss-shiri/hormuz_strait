```yaml
name: collect-hormuz-osint

# ============================================================================
# Hormuz OSINT Monitor
#
# Collection-only workflow.
#
# Runs:
#   - every 15 minutes
#   - manually from GitHub Actions
#
# It intentionally does NOT run on push.
# The collector itself commits feed.json, and a push trigger could cause
# unnecessary re-execution.
# ============================================================================

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

# Only one collector may modify feed.json at a time.
concurrency:
  group: hormuz-osint-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    name: Collect Hormuz OSINT
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:

      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      # ----------------------------------------------------------------------
      # Python
      # ----------------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      # ----------------------------------------------------------------------
      # Dependencies
      # ----------------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r collector/requirements.txt

      # ----------------------------------------------------------------------
      # Collector
      # ----------------------------------------------------------------------

      - name: Run collector
        run: |
          python collector/collect.py

      # ----------------------------------------------------------------------
      # Validate feed
      # ----------------------------------------------------------------------

      - name: Validate feed.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/data/feed.json")

          if not path.exists():
              raise SystemExit("ERROR: docs/data/feed.json does not exist")

          if path.stat().st_size == 0:
              raise SystemExit("ERROR: feed.json is empty")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("ERROR: feed.json root must be an object")

          if not isinstance(data.get("meta"), dict):
              raise SystemExit("ERROR: meta must be an object")

          if not isinstance(data.get("items"), list):
              raise SystemExit("ERROR: items must be a list")

          required = {
              "id",
              "title",
              "link",
              "source",
              "published",
              "published_ts",
          }

          for i, item in enumerate(data["items"]):
              if not isinstance(item, dict):
                  raise SystemExit(
                      f"ERROR: item {i} is not an object"
                  )

              missing = required - item.keys()

              if missing:
                  raise SystemExit(
                      f"ERROR: item {i} missing: "
                      f"{sorted(missing)}"
                  )

          print(
              f"VALID: {len(data['items'])} feed items"
          )
          PY

      # ----------------------------------------------------------------------
      # Summary
      # ----------------------------------------------------------------------

      - name: Show collection summary
        run: |
          python - <<'PY'
          import json

          with open(
              "docs/data/feed.json",
              "r",
              encoding="utf-8"
          ) as f:
              feed = json.load(f)

          meta = feed.get("meta", {})

          print("")
          print("==============================================")
          print("       HORMUZ OSINT COLLECTION")
          print("==============================================")
          print(f"Total items    : {meta.get('count', 0)}")
          print(f"New this run   : {meta.get('new_this_run', 0)}")
          print(f"Sources OK     : {len(meta.get('sources_ok', []))}")
          print(f"Sources failed : {len(meta.get('sources_failed', []))}")
          print(f"Generated      : {meta.get('generated_at', 'unknown')}")
          print("==============================================")
          print("")
          PY

      # ----------------------------------------------------------------------
      # Commit and push
      # ----------------------------------------------------------------------

      - name: Commit feed
        run: |
          git config user.name "hormuz-osint-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs/data/feed.json

          if git diff --cached --quiet; then
            echo "No feed changes detected."
            exit 0
          fi

          git commit \
            -m "feed: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"

          git push
```
